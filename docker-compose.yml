services:
  db:
    image: postgres:16-alpine
    container_name: ishtop-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ishtop
    ports:
      - "5432:5432"
    volumes:
      - ishtop-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ishtop"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ishtop-db:
