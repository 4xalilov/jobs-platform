<!doctype html>
<html lang="uz-Latn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Tarmoq yo'q — Ish top</title>
    <!--
      Oflayn zaxira sahifasi.

      Ataylab oddiy HTML, Next sahifasi emas: service worker uni BOSHQA
      manzil o'rniga qaytaradi, Next sahifasi esa bunday holatda o'z
      RSC ma'lumotini topolmay gidratsiyada yiqilardi va foydalanuvchi
      "Nimadir noto'g'ri ketdi" degan xato ekranini ko'rardi.

      Ranglar themes.json dagi qiymatlar bilan bir xil — bu fayl
      generatsiyaga qo'shilmagani uchun ular shu yerda takrorlangan.
    -->
    <style>
      :root {
        --bg: #f4f4f5;
        --text: #000;
        --muted: #707579;
        --tertiary: #a2acb4;
        --primary: #3390ec;
        --on-primary: #fff;
      }

      html.theme-dark {
        --bg: #181818;
        --text: #fff;
        --muted: #aaa;
        --tertiary: #7d7d7d;
        --primary: #8774e1;
      }

      @media (prefers-color-scheme: dark) {
        html:not(.theme-light) {
          --bg: #181818;
          --text: #fff;
          --muted: #aaa;
          --tertiary: #7d7d7d;
          --primary: #8774e1;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.25rem;
        padding: 0 2.5rem;
        text-align: center;
        background: var(--bg);
        color: var(--text);
        font-family:
          Roboto,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          "Helvetica Neue",
          Arial,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      svg {
        color: var(--tertiary);
      }

      h1 {
        margin: 1rem 0 0;
        font-size: 1.0625rem;
        line-height: 1.375rem;
        font-weight: 600;
      }

      p {
        margin: 0.375rem 0 0;
        font-size: 0.9375rem;
        line-height: 1.3125rem;
        color: var(--muted);
      }

      button {
        margin-top: 1.5rem;
        height: 2.5rem;
        padding: 0 1.25rem;
        border: 0;
        border-radius: 0.625rem;
        background: var(--primary);
        color: var(--on-primary);
        font: inherit;
        font-size: 0.9375rem;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.1s ease-out;
      }

      button:active {
        transform: scale(0.97);
      }

      button:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }

      @media (prefers-reduced-motion: reduce) {
        button {
          transition: none;
        }
        button:active {
          transform: none;
        }
      }
    </style>
    <script>
      // Tema — ilovadagi bilan bir xil kalitdan, chizishdan oldin
      (function () {
        try {
          var m = localStorage.getItem("ish.theme") || "system";
          var d =
            m === "dark" || (m === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("theme-dark", d);
          document.documentElement.classList.toggle("theme-light", !d);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <svg
      width="44"
      height="44"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
      aria-hidden="true"
    >
      <circle cx="12" cy="12" r="8.5" />
      <path d="M3.5 12h17M12 3.5c4 4.5 4 12.5 0 17-4-4.5-4-12.5 0-17" />
      <path d="M3 3l18 18" />
    </svg>

    <h1 id="title">Tarmoq yo'q</h1>
    <p id="hint">
      Internetga ulanishni tekshiring. Ochilgan ekranlar keshdan ishlashda davom etadi.
    </p>
    <button type="button" onclick="location.reload()" id="retry">Qayta urinish</button>

    <script>
      // Til ham ilovadagi kalitdan olinadi
      (function () {
        var TEXT = {
          "uz-cyrl": {
            title: "Тармоқ йўқ",
            hint: "Интернетга уланишни текширинг. Очилган экранлар кешдан ишлашда давом этади.",
            retry: "Қайта уриниш",
            lang: "uz-Cyrl",
          },
          ru: {
            title: "Нет сети",
            hint: "Проверьте подключение к интернету. Открытые экраны продолжат работать из кэша.",
            retry: "Повторить",
            lang: "ru",
          },
        };
        try {
          var locale = (localStorage.getItem("ish.locale") || "uz").replace(/"/g, "");
          var t = TEXT[locale];
          if (!t) return;
          document.getElementById("title").textContent = t.title;
          document.getElementById("hint").textContent = t.hint;
          document.getElementById("retry").textContent = t.retry;
          document.documentElement.lang = t.lang;
          document.title = t.title + " — Ish top";
        } catch (e) {}
      })();
    </script>
  </body>
</html>
